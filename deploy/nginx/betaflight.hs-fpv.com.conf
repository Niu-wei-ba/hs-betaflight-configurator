server {
    listen 80;
    listen [::]:80;
    server_name betaflight.hs-fpv.com;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/betaflight.hs-fpv.com/acme-webroot;
        allow all;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }

    access_log /www/wwwlogs/betaflight.hs-fpv.com.access.log;
    error_log /www/wwwlogs/betaflight.hs-fpv.com.error.log;
}

server {
    listen 443 ssl;
    listen 443 quic;
    listen [::]:443 ssl;
    listen [::]:443 quic;
    http2 on;
    server_name betaflight.hs-fpv.com;
    root /www/wwwroot/betaflight.hs-fpv.com/current;
    index index.html;

    ssl_certificate /www/server/panel/vhost/cert/betaflight.hs-fpv.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/betaflight.hs-fpv.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Alt-Svc 'quic=":443"; h3=":443"; h3-29=":443"';
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    error_page 497 https://$host$request_uri;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/betaflight.hs-fpv.com/acme-webroot;
        allow all;
        default_type text/plain;
        try_files $uri =404;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:4180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:4180;
        proxy_set_header Host $host;
    }

    location ^~ /presets/ {
        proxy_pass http://127.0.0.1:4180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /www/wwwlogs/betaflight.hs-fpv.com.access.log;
    error_log /www/wwwlogs/betaflight.hs-fpv.com.error.log;
}
