<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />

        <!-- Must stay a classic ES5 script and run before every module. It is
             intentionally served from Vite's public directory so an old PC
             browser can show an upgrade message even if it cannot parse the
             application bundle. -->
        <script src="%BASE_URL%browser-compatibility.js"></script>
        <script type="module" src="/src/js/utils/common.js"></script>
        <script type="module" src="/src/js/browserMain.js"></script>
        <script defer src="https://umami.hs-fpv.cn/script.js" data-website-id="1bb91f47-0a44-4918-a32b-fedcc1087e23"></script>

        <title>花生FPV | Betaflight镜像站</title>
        <meta
            name="description"
            content="Mirror-focused Betaflight-compatible configurator with presets, firmware flashing, and local device setup"
        />
        <link rel="icon" href="%BASE_URL%images/pwa/favicon.ico" />
        <link rel="apple-touch-icon" href="%BASE_URL%images/pwa/apple-touch-icon.png" sizes="128x128" />
        <meta name="theme-color" content="#eea600" />
    </head>
    <body>
        <div id="browser-compatibility-message" hidden role="alert" aria-live="assertive"></div>
        <!-- Every dialog lives in Vue now (see src/components/dialogs). Do not add markup after
             <app></app>: it would be parsed as slot content and dropped, since App.vue has no slot. -->
        <div id="main-wrapper">
            <app></app>
        </div>
    </body>
</html>
